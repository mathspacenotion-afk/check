<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="기록확인">
<meta name="theme-color" content="#1e2d5a">
<title>수학공간 수업기록 확인</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f5f4f2;color:#1a1a1a;min-height:100vh;}
.hdr{background:#fff;border-bottom:1px solid #e8e8e5;height:52px;display:flex;align-items:center;padding:0 1.25rem;gap:10px;position:sticky;top:0;z-index:50;}
.hdr-logo-img{height:30px;width:auto;}
.hdr-sub{font-size:12px;color:#aaa;}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px;}
.hdr-btn{height:30px;padding:0 10px;background:#f5f4f2;border:1px solid #e0e0de;border-radius:7px;cursor:pointer;font-size:12px;color:#555;font-family:inherit;}
.hdr-btn:hover{background:#ececea;}
.main{max-width:680px;margin:0 auto;padding:1.25rem 1rem;}
/* Date banner */
.date-bar{background:#fff;border:1px solid #e8e8e5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:.875rem;display:flex;align-items:center;gap:10px;}
.date-txt{font-size:15px;font-weight:600;}
.date-day{font-size:11px;background:#1a1a1a;color:#fff;border-radius:4px;padding:2px 8px;}
.refresh{margin-left:auto;width:34px;height:34px;background:#f5f4f2;border:1px solid #e0e0de;border-radius:8px;cursor:pointer;font-size:15px;color:#555;}
.refresh:hover{background:#ececea;}
.date-inp{flex:1;min-width:0;height:34px;border:1px solid #e0e0de;border-radius:8px;padding:0 8px;font-size:14px;font-weight:600;color:#1a1a1a;font-family:inherit;background:#fff;outline:none;}
.date-inp:focus{border-color:#999;}
.today-btn{height:34px;padding:0 10px;background:#f0f0ee;border:1px solid #e0e0de;border-radius:8px;cursor:pointer;font-size:12px;color:#555;font-family:inherit;white-space:nowrap;flex-shrink:0;}
.today-btn:hover{background:#e5e5e3;}
/* Summary */
.summary{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1rem;}
.sum-card{background:#fff;border:1px solid #e8e8e5;border-radius:12px;padding:1rem;text-align:center;}
.sum-card.warn{background:#fff5f5;border-color:#fecaca;}
.sum-card.ok{background:#f0fdf4;border-color:#bbf7d0;}
.sum-num{font-size:28px;font-weight:700;line-height:1;margin-bottom:4px;}
.sum-card.warn .sum-num{color:#dc2626;}
.sum-card.ok .sum-num{color:#15803d;}
.sum-lbl{font-size:12px;color:#888;}
/* Alert */
.alert{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:.75rem 1rem;font-size:13px;color:#c2410c;line-height:1.6;margin-bottom:1rem;display:none;}
.alert.show{display:block;}
.alert b{font-weight:700;}
/* Class list */
.sec-title{font-size:11px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:.07em;margin:1.25rem 0 .625rem;}
.cls-card{background:#fff;border:1px solid #e8e8e5;border-radius:10px;padding:.875rem 1rem;margin-bottom:.5rem;display:flex;align-items:center;gap:10px;}
.cls-card.missing{background:#fff5f5;border-color:#fecaca;}
.cls-icon{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.cls-icon.x{background:#fee2e2;color:#dc2626;}
.cls-icon.v{background:#dcfce7;color:#15803d;}
.cls-info{flex:1;min-width:0;}
.cls-name{font-size:14px;font-weight:600;margin-bottom:2px;}
.cls-meta{font-size:11px;color:#aaa;}
.cls-time{font-size:11px;color:#888;flex-shrink:0;}
.cls-time.late{color:#dc2626;font-weight:600;}
/* Loading / Empty */
.loading{display:flex;align-items:center;justify-content:center;gap:8px;color:#888;font-size:13px;padding:2rem 0;}
.spin{width:16px;height:16px;border:2px solid #e5e5e3;border-top-color:#6366f1;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:2rem 1rem;color:#bbb;font-size:13px;}
.err-box{background:#fff5f5;border:1px solid #fecaca;border-radius:10px;padding:1rem;font-size:13px;color:#dc2626;line-height:1.6;}
/* Modal */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;justify-content:center;align-items:flex-start;padding:1.5rem 1rem;overflow-y:auto;}
.ov.open{display:flex;}
.modal{background:#fff;border-radius:16px;padding:1.5rem;width:100%;max-width:440px;margin:auto;}
.m-ttl{font-size:16px;font-weight:700;margin-bottom:1.25rem;}
.mf{margin-bottom:.75rem;}
.mf label{font-size:12px;color:#555;display:block;margin-bottom:3px;}
.mf label a{color:#3b82f6;font-size:11px;margin-left:5px;text-decoration:none;}
.mf-hint{font-size:11px;color:#bbb;margin-top:3px;}
.inp{width:100%;height:38px;padding:0 10px;border:1px solid #e0e0de;border-radius:8px;font-size:13px;color:#1a1a1a;background:#fff;font-family:inherit;}
.inp:focus{border-color:#999;outline:none;}
.m-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:1.25rem;}
.btn-c{background:none;border:none;color:#888;cursor:pointer;font-size:13px;padding:.4rem .75rem;font-family:inherit;}
.btn-s{background:#1a1a1a;border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:13px;font-weight:600;padding:.4rem 1.1rem;font-family:inherit;}
.btn-s:hover{background:#333;}
.share-area{background:#f9f9f8;border:1px solid #e8e8e5;border-radius:8px;padding:.875rem;margin-top:1rem;}
.share-lbl{font-size:10px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.6rem;}
.share-code{width:100%;height:48px;background:#fff;border:1px solid #e0e0de;border-radius:6px;padding:7px;font-size:10px;font-family:monospace;resize:none;color:#555;}
.share-btns{display:flex;gap:6px;margin-top:6px;}
.share-btn{flex:1;height:32px;border:1px solid #e0e0de;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;background:#fff;color:#555;}
.share-btn.p{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
</style>
</head>
<body>

<div class="hdr">
  <span style="font-size:14px;font-weight:700;">수학공간</span>
  <span class="hdr-sub">수업기록 확인</span>
  <div class="hdr-r">
    <button class="hdr-btn" id="cfgBtn">&#9881; 설정</button>
  </div>
</div>

<div class="ov" id="cfgOv">
<div class="modal">
  <div class="m-ttl">설정</div>
  <div class="mf">
    <label>Airtable PAT <a href="https://airtable.com/create/tokens" target="_blank">발급 &#8594;</a></label>
    <input class="inp" type="password" id="cPat" placeholder="pat..." />
  </div>
  <div class="mf">
    <label>수업기록 Base ID</label>
    <input class="inp" type="text" id="cBase" placeholder="appXXXXXXXXXXXXXX" />
  </div>
  <div class="mf">
    <label>수업기록 테이블 이름</label>
    <input class="inp" type="text" id="cTbl" placeholder="수업 기록" />
    <p class="mf-hint">수업일시(Date), 반 필드가 있어야 합니다</p>
  </div>
  <div class="share-area">
    <div class="share-lbl">설정 코드</div>
    <textarea class="share-code" id="shareCode" readonly></textarea>
    <div class="share-btns">
      <button class="share-btn" id="btnCopy">복사</button>
      <button class="share-btn p" id="btnImport">가져오기</button>
    </div>
  </div>
  <div class="m-foot">
    <button class="btn-c" id="cfgCancel">취소</button>
    <button class="btn-s" id="cfgSave">저장</button>
  </div>
</div>
</div>

<div class="main">
  <div class="date-bar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2" style="flex-shrink:0;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <input type="date" id="dateInput" class="date-inp" />
    <span class="date-day" id="dayTxt">-</span>
    <button class="today-btn" id="todayBtn">오늘</button>
    <button class="refresh" id="refBtn">&#8635;</button>
  </div>

  <div class="alert" id="alertBox"></div>

  <div class="summary">
    <div class="sum-card warn">
      <div class="sum-num" id="missCount">-</div>
      <div class="sum-lbl">미작성</div>
    </div>
    <div class="sum-card ok">
      <div class="sum-num" id="doneCount">-</div>
      <div class="sum-lbl">작성 완료</div>
    </div>
  </div>

  <div id="content">
    <div class="loading"><div class="spin"></div>불러오는 중...</div>
  </div>
</div>

<script>
var CFG='shg_check', AT='https://api.airtable.com/v0';

// 반별 요일 정보 (0=일, 1=월, ... 6=토)
var CLASSES=[
  {name:'중1 월수금', days:[1,3,5], teacher:'박주희'},
  {name:'중1 선행', days:[1,3,5], teacher:'박주희'},
  {name:'중2 월수금', days:[1,3,5], teacher:'박주희'},
  {name:'중3 월수금B', days:[1,3,5], teacher:'박주희'},
  {name:'중1 화목', days:[2,4], teacher:'신해리'},
  {name:'중3 월수금', days:[1,3,5], teacher:'신해리'},
  {name:'중3 화목', days:[2,4], teacher:'신해리'},
  {name:'중3 기타', days:[2,4], teacher:'신해리'},
  {name:'공수2 기본', days:[1,3,5], teacher:'신해리'},
  {name:'고1 명지A', days:[1,3,5], teacher:'정열'},
  {name:'고1 충암A', days:[1,3,5], teacher:'정열'},
  {name:'고1 충암B', days:[2,4,6], teacher:'정열'},
  {name:'고1 충암C', days:[1,3,5], teacher:'정열'},
  {name:'고1 충암D', days:[2,4,6], teacher:'정열'},
  {name:'고1 명지B', days:[2,4,6], teacher:'위승호'},
  {name:'고1 명지C', days:[1,3,5], teacher:'위승호'},
  {name:'고1 명지D', days:[2,4,6], teacher:'위승호'},
  {name:'고1 수준별B', days:[1,3,5], teacher:'위승호'},
  {name:'고1 수준별C', days:[2,4,6], teacher:'위승호'},
  {name:'고2 명지B', days:[1,3,5], teacher:'김현정'},
  {name:'고2 수준별B', days:[1,3,5], teacher:'김현정'},
  {name:'고2 수준별C', days:[1,3,5], teacher:'김현정'},
  {name:'고2 충암C', days:[2,4,6], teacher:'김현정'},
  {name:'고1 수준별S', days:[2,4,0], teacher:'부원장'},
  {name:'고2 명지A', days:[2,4,0], teacher:'부원장'},
  {name:'고2 수준별A', days:[1,3,0], teacher:'부원장'},
  {name:'고2 충암A', days:[2,4,0], teacher:'부원장'}
];

var DAY_NAMES=['일','월','화','수','목','금','토'];

function gc(){try{return JSON.parse(localStorage.getItem(CFG))||{};}catch(e){return{};}}
function sc(c){localStorage.setItem(CFG,JSON.stringify(c));}
function gv(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function sv(id,v){var e=document.getElementById(id);if(e)e.value=v||'';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* Settings */
function openCfg(){
  var c=gc();
  sv('cPat',c.pat);sv('cBase',c.base);sv('cTbl',c.tbl);
  genCode();
  document.getElementById('cfgOv').classList.add('open');
}
function closeCfg(){document.getElementById('cfgOv').classList.remove('open');}
function saveCfg(){
  var c={pat:gv('cPat'),base:gv('cBase'),tbl:gv('cTbl')};
  sc(c);genCode();closeCfg();
  loadData();
}
function genCode(){
  var c=gc();
  if(!c.pat){sv('shareCode','');return;}
  try{sv('shareCode',btoa(unescape(encodeURIComponent(JSON.stringify(c)))));}catch(e){}
}
function copyCode(){
  var code=gv('shareCode');
  if(!code){alert('먼저 설정을 저장해주세요');return;}
  navigator.clipboard.writeText(code).then(function(){
    var b=document.getElementById('btnCopy');b.textContent='복사됨';
    setTimeout(function(){b.textContent='복사';},2000);
  });
}
function importCode(){
  var code=prompt('설정 코드를 붙여넣으세요:');
  if(!code)return;
  try{
    var cfg=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    sc(cfg);
    sv('cPat',cfg.pat);sv('cBase',cfg.base);sv('cTbl',cfg.tbl);
    genCode();alert('설정을 가져왔습니다. 저장을 눌러주세요.');
  }catch(e){alert('올바르지 않은 코드입니다.');}
}

/* Airtable */
async function atFetch(path){
  var pat=gc().pat;
  if(!pat){openCfg();throw new Error('PAT가 없습니다');}
  var r=await fetch(AT+path,{headers:{'Authorization':'Bearer '+pat}});
  if(!r.ok){var e=await r.json().catch(function(){return{};});throw new Error((e.error&&e.error.message)||'HTTP '+r.status);}
  return r.json();
}

/* Date */
function toIso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function getTodayIso(){return toIso(new Date());}
function getSelDate(){
  var v=document.getElementById('dateInput').value;
  return v||getTodayIso();
}
function getSelDayIdx(){
  var v=getSelDate();
  var p=v.split('-');
  return new Date(+p[0], +p[1]-1, +p[2]).getDay();
}
function isToday(){return getSelDate()===getTodayIso();}
function isPastNoon(){
  // 오늘이 아니면 항상 지난 것으로 처리 (과거 날짜) / 미래는 대기
  var sel=getSelDate(), today=getTodayIso();
  if(sel<today) return true;           // 과거 → 지연
  if(sel>today) return false;          // 미래 → 대기
  return new Date().getHours()>=12;    // 오늘 → 12시 기준
}
function setToday(){
  document.getElementById('dateInput').value=getTodayIso();
  loadData();
}

/* Main load */
async function loadData(){
  var c=gc();
  var content=document.getElementById('content');
  var today=getSelDate();
  var dayIdx=getSelDayIdx();

  document.getElementById('dayTxt').textContent=DAY_NAMES[dayIdx]+'요일';

  if(!c.pat||!c.base||!c.tbl){
    content.innerHTML='<div class="err-box">&#9881; 설정에서 Airtable PAT와 수업기록 테이블 정보를 입력해주세요</div>';
    return;
  }

  content.innerHTML='<div class="loading"><div class="spin"></div>오늘 수업기록 확인 중...</div>';

  // 오늘 수업이 있는 반
  var todayClasses=CLASSES.filter(function(cl){return cl.days.indexOf(dayIdx)!==-1;});

  if(!todayClasses.length){
    content.innerHTML='<div class="empty">'+(isToday()?'오늘은':'이 날은')+' 수업이 없습니다 &#127881;</div>';
    document.getElementById('missCount').textContent='0';
    document.getElementById('doneCount').textContent='0';
    return;
  }

  try{
    // 오늘 날짜 기록 조회
    var filter='IS_SAME({수업일시},"'+today+'","day")';
    var url='/'+c.base+'/'+encodeURIComponent(c.tbl)+'?filterByFormula='+encodeURIComponent(filter);
    var data=await atFetch(url);
    var recs=data.records||[];

    // 기록된 반 이름 수집
    var written=[];
    recs.forEach(function(r){
      var v=r.fields['반'];
      if(!v)return;
      if(Array.isArray(v)) v.forEach(function(x){written.push(String(x));});
      else written.push(String(v));
    });

    // 미작성 / 작성완료 분류
    var missing=[],done=[];
    todayClasses.forEach(function(cl){
      if(written.indexOf(cl.name)!==-1) done.push(cl);
      else missing.push(cl);
    });

    // 카운트
    document.getElementById('missCount').textContent=missing.length;
    document.getElementById('doneCount').textContent=done.length;

    // 12시 이후 알림
    var alertBox=document.getElementById('alertBox');
    if(isPastNoon()&&missing.length>0){
      alertBox.className='alert show';
      var msg=isToday()
        ? '&#9888;&#65039; <b>12시가 지났는데 '+missing.length+'개 반이 미작성 상태입니다.</b><br>담당 선생님께 확인이 필요합니다.'
        : '&#9888;&#65039; <b>'+missing.length+'개 반의 수업기록이 없습니다.</b><br>해당 날짜 기록을 확인해주세요.';
      alertBox.innerHTML=msg;
    } else {
      alertBox.className='alert';
    }

    // 렌더링
    var html='';
    if(missing.length){
      html+='<div class="sec-title">미작성 ('+missing.length+')</div>';
      missing.forEach(function(cl){
        html+='<div class="cls-card missing">'
          +'<div class="cls-icon x">&#10007;</div>'
          +'<div class="cls-info"><div class="cls-name">'+esc(cl.name)+'</div>'
          +'<div class="cls-meta">'+esc(cl.teacher)+' 선생님</div></div>'
          +'<div class="cls-time'+(isPastNoon()?' late':'')+'">'+(isPastNoon()?'지연':'대기')+'</div>'
          +'</div>';
      });
    }
    if(done.length){
      html+='<div class="sec-title">작성 완료 ('+done.length+')</div>';
      done.forEach(function(cl){
        html+='<div class="cls-card">'
          +'<div class="cls-icon v">&#10003;</div>'
          +'<div class="cls-info"><div class="cls-name">'+esc(cl.name)+'</div>'
          +'<div class="cls-meta">'+esc(cl.teacher)+' 선생님</div></div>'
          +'</div>';
      });
    }
    if(!missing.length){
      html='<div class="empty" style="padding:1.5rem;color:#15803d;font-weight:600;">&#127881; '+(isToday()?'오늘':'해당일')+' 모든 반 기록 완료!</div>'+html;
    }
    content.innerHTML=html;

  }catch(e){
    content.innerHTML='<div class="err-box">오류: '+esc(e.message)+'<br><small style="opacity:.7">Base ID, 테이블명, 필드명(수업일시/반)을 확인해주세요</small></div>';
  }
}

/* Events */
document.getElementById('cfgBtn').addEventListener('click',openCfg);
document.getElementById('cfgCancel').addEventListener('click',closeCfg);
document.getElementById('cfgSave').addEventListener('click',saveCfg);
document.getElementById('cfgOv').addEventListener('click',function(e){if(e.target===this)closeCfg();});
document.getElementById('btnCopy').addEventListener('click',copyCode);
document.getElementById('btnImport').addEventListener('click',importCode);
document.getElementById('refBtn').addEventListener('click',loadData);
document.getElementById('dateInput').addEventListener('change',loadData);
document.getElementById('todayBtn').addEventListener('click',setToday);

/* Init */
document.getElementById('dateInput').value=getTodayIso();
var ic=gc();
if(!ic.pat) openCfg();
loadData();
// 5분마다 자동 새로고침
setInterval(function(){if(isToday())loadData();}, 300000);
</script>
</body>
</html>
